[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/core",
    "crates/draft",
    "crates/agent",
    "crates/workspace",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/0x5457/threadbase"
authors = ["Threadbase contributors"]

[workspace.dependencies]
threadbase-shared = { path = "crates/shared" }
threadbase-core = { path = "crates/core" }
threadbase-draft = { path = "crates/draft" }
threadbase-agent = { path = "crates/agent" }
threadbase-workspace = { path = "crates/workspace" }

agent-client-protocol = { version = "5.4", features = ["process", "unstable_subagents", "unstable_end_turn_token_usage", "unstable_plan_operations"] }
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
axum = { version = "0.8", features = ["macros", "ws"] }
axum-extra = { version = "0.12", features = ["cookie"] }
clap = { version = "4.6", features = ["derive"] }
content_inspector = "0.2"
dotenvy = "0.15"
futures-util = { version = "0.3", features = ["sink"] }
gray_matter = "0.3"
hex = "0.4"
# web-push's ece links OpenSSL; vendored builds it statically into the
# binary, so darwin releases run without a Homebrew OpenSSL and the
# x86_64 target cross-compiles on Apple Silicon.
openssl-sys = { version = "0.9", features = ["vendored"] }
ignore = "0.4"
jiff = "0.2"
mime_guess = "2.0"
path-clean = "1.0"
plist = "1.10"
portable-pty = "0.9"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rust-embed = "8.13"
self-replace = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
service-manager = "0.11"
sha2 = "0.10"
similar = "3.2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "derive", "macros"] }
strum = { version = "0.28", features = ["derive"] }
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.54", features = ["full"] }
tokio-tungstenite = "0.30"
tower = "0.5"
tower-http = { version = "0.6", features = ["compression-gzip", "fs", "trace", "timeout"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ts-rs = { version = "12.0", features = ["format", "no-serde-warnings", "serde-json-impl"] }
ulid = "1.2"
unidiff = "0.4"
url = "2.5"
web-push = { version = "0.11", default-features = false }
which = "8.0"
yrs = "0.17"
y-sync = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
