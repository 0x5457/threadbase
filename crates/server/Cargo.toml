[package]
name = "threadbase"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "threadbase_server"
path = "src/lib.rs"

[[bin]]
name = "threadbase"
path = "src/main.rs"

[dependencies]
threadbase-agent.workspace = true
threadbase-core.workspace = true
threadbase-draft.workspace = true
threadbase-shared.workspace = true
threadbase-workspace.workspace = true
anyhow.workspace = true
axum.workspace = true
axum-extra.workspace = true
base64.workspace = true
clap.workspace = true
content_inspector.workspace = true
cookie = "0.18"
directories = "6.0"
dotenvy.workspace = true
futures-util.workspace = true
gray_matter.workspace = true
hex.workspace = true
ignore.workspace = true
jiff.workspace = true
mime_guess.workspace = true
plist.workspace = true
portable-pty.workspace = true
rand.workspace = true
reqwest.workspace = true
# Embedded in release builds; debug builds read web/dist from disk.
rust-embed.workspace = true
self-replace.workspace = true
serde.workspace = true
serde_json.workspace = true
service-manager.workspace = true
sha2.workspace = true
sqlx.workspace = true
strum.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
ulid.workspace = true
unidiff.workspace = true
url.workspace = true
web-push.workspace = true
# Nothing here calls OpenSSL directly: pulling it in only turns on the
# vendored feature, which builds it statically into every binary that ends
# up with web-push's ece in its graph. Darwin releases then run without a
# Homebrew OpenSSL, and the x86_64 target cross-compiles on Apple Silicon.
openssl-sys.workspace = true
which.workspace = true
yrs.workspace = true
y-sync.workspace = true

# A dedicated Mac must not sleep under the team; the assertion is held by the
# server itself, which is the only cross-platform-safe place for it.
[target.'cfg(target_os = "macos")'.dependencies]
keepawake = "0.6"

[dev-dependencies]
tempfile.workspace = true
tower.workspace = true

[lints]
workspace = true
