# mise 任务：threadbase 本地一键启动
# 用法：mise run start   （默认 http://127.0.0.1:7777）

[tasks.install-web]
description = "安装前端依赖"
hide = true
run = "pnpm --dir web install --frozen-lockfile"

[tasks.build-web]
description = "构建前端资源（web/dist，会被单二进制内嵌）"
hide = true
depends = ["install-web"]
run = "pnpm --dir web build"
sources = [
  "web/package.json",
  "web/pnpm-lock.yaml",
  "web/index.html",
  "web/vite.config.ts",
  "web/tsconfig.json",
  "web/src/**",
]
outputs = ["web/dist/**"]

[tasks.start]
description = "一键本地启动：构建前端后运行服务（http://127.0.0.1:7777）"
depends = ["build-web"]
run = "cargo run -p threadbase"
