name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # The browser terminal config sets `window-size manual`, a value only
      # tmux 3.7+ accepts; ubuntu's stock 3.6a server refuses to start with
      # it, so build the version the product actually requires.
      - name: Install tmux 3.8
        run: |
          sudo apt-get update
          sudo apt-get install -y libevent-dev libncurses-dev bison pkg-config
          curl -fsSL https://github.com/tmux/tmux/releases/download/3.8/tmux-3.8.tar.gz | tar xz
          (cd tmux-3.8 && ./configure >/dev/null && make -j"$(nproc)" >/dev/null && sudo make install)
          tmux -V

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build web assets
        working-directory: web
        run: |
          pnpm typecheck
          pnpm doctor:ci
          pnpm build

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # The agent-flow tests mutate process environment variables, so each
      # test needs its own process: that is what the local `verify.sh` gate
      # uses too.
      - name: Test
        run: cargo nextest run --workspace

      - name: Verify embedded assets
        run: |
          cargo build -p threadbase
          test -f web/dist/index.html

  # The install command has a launchd backend that only compiles on macOS.
  # Compiling it (clippy checks all targets) is the point; running the Linux
  # test suite here would only add pty flakiness.
  check-macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # rust-embed needs web/dist at compile time; the real bundle is built by
      # the Linux job and the release workflow.
      - name: Stub web assets
        run: |
          mkdir -p web/dist
          printf '<!doctype html>\n' > web/dist/index.html

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
